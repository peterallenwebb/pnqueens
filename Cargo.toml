[package]
name = "pnqueens"
version = "0.1.0"
edition = "2024"

[dependencies]
gxhash = "3.5.0"
rayon = "1.12.0"
# CUDA driver + NVRTC bindings for the optional GPU path (feature `cuda`).
# The kernel is compiled at run time, so no CUDA toolkit is needed to build;
# the machine that runs `--cuda` needs the NVIDIA driver and libnvrtc.
cudarc = { version = "0.12", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cuda-12060"] }

[features]
default = []
cuda = ["dep:cudarc"]

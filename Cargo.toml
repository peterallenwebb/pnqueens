[package]
name = "pnqueens"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1.12.0"
# SHA-256 of the binary itself, recorded with every run's results.
sha2 = "0.10"
# CUDA driver + NVRTC bindings for the optional GPU path (feature `cuda`).
# The kernel is compiled at run time, so no CUDA toolkit is needed to build;
# the machine that runs `--cuda` needs the NVIDIA driver and libnvrtc.
cudarc = { version = "0.12", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "cuda-12060"] }

[build-dependencies]
# Compiles the enumerate kernel as host C++ for `cargo test --features emulate`.
cc = { version = "1", optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
# Kernel emulation test: runs kernel/enumerate.cu as host C++ (needs a C++ compiler, no GPU).
emulate = ["dep:cc"]
